<!DOCTYPE html>
<html>
<head>
    <title>Link Title Demo</title>
</head>
<body>
    <!-- Simple link with title -->
    <a href="https://www.google.com" title="Go to Google Homepage">Google</a>

    <br><br>

    <!-- Multiple links with titles -->
    <a href="https://www.microsoft.com" title="Visit Microsoft Official Website">Microsoft</a>
    <br>
    <a href="https://www.amazon.com" title="Shop on Amazon">Amazon</a>
    <br>
    <a href="https://www.apple.com" title="Explore Apple Products">Apple</a>
</body>
</html>
