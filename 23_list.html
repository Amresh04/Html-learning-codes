<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Unordered HTML List</h1>
    <ul>
  <li>Coffee</li>   
  <li>Tea</li>
  <li>Milk</li>
  </ul>
  <hr>
    <ul type="square">
  <li>Coffee</li>   
  <li>Tea</li>
  <li>Milk</li>
  </ul>

<hr>
    <ul type="circle">
  <li>Coffee</li>   
  <li>Tea</li>
  <li>Milk</li>
  </ul>
  <hr>
<h1>Ordered HTML List</h1>
<ol>
  <li >Coffee</li>
  <li>Tea</li>
  <li>Milk</li>
</ol>
<hr>
<ol type="I">
  <li >Coffee</li>
  <li>Tea</li>
  <li>Milk</li>
</ol>
<ol type="A">
  <li >Coffee</li>
  <li>Tea</li>
  <li>Milk</li>
</ol>
<hr>
<h1>HTML Description Lists</h1>

<dl>
  <dt>Coffee</dt>
  <dd>- black hot drink</dd>
  <dt>Milk</dt>
  <dd>- white cold drink</dd>
</dl>

<!-- The <dl> tag defines the description list, the <dt> tag defines the term (name), and the <dd> tag describes each term -->
</body>
</html>
