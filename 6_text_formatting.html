<!DOCTYPE html>
<html>
<head>
    <title>Text Formatting Demo</title>
</head>
<body>
    <p><b>Bold text</b></p>
    <hr>
    <p><strong>Important text</strong></p><hr>
    <p><i>Italic text</i></p><hr>
    <p><em>Emphasized text</em></p><hr>
    <p><mark>Marked text</mark></p><hr>
    <p><small>Smaller text</small></p><hr>
    <p><del>Deleted text</del></p><hr>
    <p><ins>Inserted text</ins></p><hr>
    <p>H<sub>2</sub>O (Subscript)</p><hr>
    <p>X<sup>2</sup> + Y<sup>2</sup> (Superscript)</p>
<hr>



</body>
</html>
